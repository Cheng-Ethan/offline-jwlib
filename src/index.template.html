<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5f0">
<meta name="offline-library-version" content="@@APP_VERSION@@">
<title>我的私人图书馆</title>
<style>@@CSS@@</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="logo">书</div><span data-i18n="我的私人图书馆">我的私人图书馆</span></div>
    <div class="top-actions"><button class="iconbtn" id="langBtn" data-i18n-title="界面语言" aria-label="界面语言" data-i18n-aria-label="界面语言">中</button><button class="iconbtn" id="historyBtn" data-i18n-title="阅读历史" aria-label="阅读历史" data-i18n-aria-label="阅读历史"><svg class="history-clock" viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 12a8.5 8.5 0 1 1-2.5-6.1"/><path d="M20.6 3.4v4.8h-4.8"/><path d="M12 7.6V12l3.1 1.9"/></svg></button><button class="iconbtn" id="moreBtn" data-i18n-title="更多" aria-label="更多" data-i18n-aria-label="更多"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button></div>
  </header>
  <main id="home">
    <div class="eyebrow">PERSONAL LIBRARY</div>
    <h1 id="libraryTitle">首页</h1>
    <div class="sub" id="librarySubtitle">今日经文、收藏和最近导入。</div>
    <div id="sectionDashboard" class="section-dashboard" aria-live="polite"></div>
    <div class="content-lang-bar" id="contentLangBar"></div>
    <div class="library-nav" id="libraryTabs">
      <button class="active" data-tab="publications" data-i18n="分类">分类</button>
      <button data-tab="favorites" data-i18n="收藏">收藏</button>
    </div>
    <div class="toolbar" id="importToolbar" style="margin:12px 0">
      <button class="btn" id="importBtn"><span class="btn-icon"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg></span><span data-i18n="导入 PUB">导入 PUB</span></button>
      <button class="btn secondary" id="backupBtn" data-i18n="导出备份">导出备份</button>
      <button class="btn ghost" id="restoreBtn" data-i18n="恢复备份">恢复备份</button>
      <input id="fileInput" type="file" accept=".jwpub,.pub,application/octet-stream" multiple hidden>
      <input id="backupInput" type="file" accept=".json,application/json" hidden>
      <input id="languagePackInput" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="crumbs" id="breadcrumbs" style="display:none"></div>
    <div class="library-heading"><h2 id="listHeading" data-i18n="按类型浏览">按类型浏览</h2><span class="sub" id="count"></span><button class="section-help-btn" id="librarySearchBtn" data-i18n-title="搜索" title="搜索" aria-label="搜索" data-i18n-aria-label="搜索" style="display:none"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.3"/><path d="m15.5 15.5 4.2 4.2"/></svg></button></div>
    <div class="category-grid" id="categories"></div>
    <div class="grid" id="books"></div>
    <div class="empty" id="empty">这里还没有出版物。<br>点击右上角「更多」，从您的设备选择 PUB 文件。</div>
    
  </main>
  <div class="note-dock" id="noteDock"><button type="button" id="noteDockOpen"></button></div>
  <nav class="bottom-nav" id="bottomNav" aria-label="主导航" data-i18n-aria-label="主导航">
    <div class="rail-head"><div class="logo">书</div><span class="rail-brand" data-i18n="我的私人图书馆">我的私人图书馆</span></div>
    <div class="rail-links">
      <button data-primary="home" class="active"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.6l8.5 7.2V21h-6v-5.4h-5V21h-6z"/></svg></span><span data-i18n="首页">首页</span></button>
      <button data-primary="bible"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c2.8-.8 5.1-.2 8 1.4v13c-2.9-1.6-5.2-2.2-8-1.4z"/><path d="M20 5.5c-2.8-.8-5.1-.2-8 1.4v13c2.9-1.6 5.2-2.2 8-1.4z"/></svg></span><span data-i18n="圣经">圣经</span></button>
      <button data-primary="library"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span><span data-i18n="多媒体图书馆">多媒体图书馆</span></button>
      <button data-primary="meetings"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.6 20c.6-3.3 2.6-5 5.4-5s4.8 1.7 5.4 5"/><circle cx="17" cy="9" r="2.2"/><path d="M16.2 14.5c2.4.2 3.8 1.9 4.2 4.5"/></svg></span><span data-i18n="聚会">聚会</span></button>
      <button data-primary="study"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.1-1 10-10-3.1-3.1-10 10z"/><path d="M13.9 6.8l3.1 3.1"/></svg></span><span data-i18n="个人研读">个人研读</span></button>
    </div>
    <button type="button" class="rail-toggle" id="sidebarToggle" title="收起栏目" aria-label="收起栏目" data-i18n-aria-label="收起栏目" aria-pressed="false"><span class="rail-toggle-icon"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></span><span class="rail-toggle-label">收起栏目</span></button>
  </nav>
</div>

<section id="reader">
  <div class="reader-head">
    <button class="iconbtn" id="backBtn" aria-label="返回" data-i18n-aria-label="返回"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg></button>
    <button class="iconbtn" id="sideNavBtn" title="收起栏目" aria-label="收起栏目" data-i18n-aria-label="收起栏目" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6.5h16M4 12h16M4 17.5h16"/></svg></button>
    <div class="reader-title" id="readerTitle">出版物</div>
    <button class="iconbtn" id="readerMoreBtn" title="阅读设置" aria-label="阅读设置" data-i18n-title="阅读设置" data-i18n-aria-label="阅读设置" aria-expanded="false"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h.01M12 12h.01M19 12h.01"/></svg></button>
  </div>
  <div class="reader-tools-menu" id="readerToolsMenu" role="menu" aria-label="阅读设置" data-i18n-aria-label="阅读设置">
    <button type="button" class="reader-tool" id="tocBtn" role="menuitem" data-i18n="目录" aria-label="目录" data-i18n-aria-label="目录" aria-pressed="false">目录</button>
    <button type="button" class="reader-tool" id="readerSearchBtn" role="menuitem" data-i18n="搜索">搜索</button>
    <button type="button" class="reader-tool" id="prevBtn" role="menuitem" data-i18n="上一节">上一节</button>
    <button type="button" class="reader-tool" id="nextBtn" role="menuitem" data-i18n="下一节">下一节</button>
    <button type="button" class="reader-tool" id="bookmarkBtn" role="menuitem" aria-pressed="false"><span class="btn-icon"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3.8 2.6 5.3 5.8.8-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8L3.6 9.9l5.8-.8z"/></svg></span><span data-i18n="书签">书签</span></button>
    <button type="button" class="reader-tool" id="noteBtn" role="menuitem"><span class="btn-icon"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 4.5h13v10.2l-4.8 4.8H5.5z"/><path d="M18.5 14.7h-4.8v4.8"/><path d="M12 8.4v4.8M9.6 10.8h4.8"/></svg></span><span data-i18n="笔记">笔记</span></button>
    <button type="button" class="reader-tool" id="readerLangBtn" role="menuitem" data-i18n="语言版本" style="display:none">语言版本</button>
    <button type="button" class="reader-tool" id="pronunciationBtn" role="menuitem" data-pinyin-toggle data-i18n="拼音" aria-pressed="false">拼音</button>
    <button type="button" class="reader-tool" id="fontDown" role="menuitem" data-i18n="缩小字号">缩小字号</button>
    <button type="button" class="reader-tool" id="fontUp" role="menuitem" data-i18n="放大字号">放大字号</button>
  </div>
  <div class="reader-layout">
    <aside class="desktop-sidebar" id="desktopSidebar" aria-label="阅读器导航" data-i18n-aria-label="阅读器导航">
      <div class="desktop-sidebar-title" data-i18n="图书馆">图书馆</div>
      <button data-reader-primary="home"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 10.8 12 3.6l8.5 7.2V21h-6v-5.4h-5V21h-6z"/></svg></span><span class="side-label" data-i18n="首页">首页</span></button>
      <button data-reader-primary="bible"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5c2.8-.8 5.1-.2 8 1.4v13c-2.9-1.6-5.2-2.2-8-1.4z"/><path d="M20 5.5c-2.8-.8-5.1-.2-8 1.4v13c2.9-1.6 5.2-2.2 8-1.4z"/></svg></span><span class="side-label" data-i18n="圣经">圣经</span></button>
      <button data-reader-primary="library"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg></span><span class="side-label" data-i18n="多媒体图书馆">多媒体图书馆</span></button>
      <button data-reader-primary="meetings"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3"/><path d="M3.6 20c.6-3.3 2.6-5 5.4-5s4.8 1.7 5.4 5"/><circle cx="17" cy="9" r="2.2"/><path d="M16.2 14.5c2.4.2 3.8 1.9 4.2 4.5"/></svg></span><span class="side-label" data-i18n="聚会">聚会</span></button>
      <button data-reader-primary="study"><span class="nav-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4.1-1 10-10-3.1-3.1-10 10z"/><path d="M13.9 6.8l3.1 3.1"/></svg></span><span class="side-label" data-i18n="个人研读">个人研读</span></button>
      <div class="desktop-sidebar-foot" data-i18n="离线阅读">离线阅读</div>
    </aside>
    <aside class="desktop-toc" id="desktopToc"><div class="desktop-toc-title" data-i18n="本书目录">本书目录</div><div id="desktopTocList"></div></aside>
    <div class="reader-body" id="readerBody"><article id="article"></article></div>
    <aside class="reader-sidepanel" id="readerSidePanel" aria-label="链接内容" data-i18n-aria-label="链接内容">
      <div class="reader-sidepanel-head"><div class="reader-sidepanel-title" id="readerSidePanelTitle">链接内容</div><button class="link-popover-close" id="readerSidePanelClose" aria-label="关闭" data-i18n-aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
      <div class="reader-sidepanel-body link-popover-body" id="readerSidePanelBody"></div>
    </aside>
  </div>
</section>
  <section class="reader-search" id="readerSearchPanel" role="dialog" aria-modal="false" aria-label="搜索" data-i18n-aria-label="搜索">
    <div class="reader-search-box">
      <div class="reader-search-head">
        <input class="reader-search-input" id="readerSearchInput" data-i18n-placeholder="搜索经文或出版物…" placeholder="搜索经文或出版物…" autocomplete="off">
        <button class="btn secondary reader-search-run" type="button" id="readerSearchRun" data-i18n="搜索">搜索</button>
        <button class="iconbtn" type="button" id="readerSearchClose" aria-label="关闭" data-i18n-aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="reader-search-scope" id="readerSearchScope"></div>
      <div class="reader-search-recent" id="readerSearchRecent"></div>
      <div class="reader-search-results" id="readerSearchResults"></div>
    </div>
  </section>
<section class="link-popover" id="linkPopover" role="dialog" aria-modal="false" aria-label="链接内容" data-i18n-aria-label="链接内容">
  <div class="link-popover-head">
    <div class="link-popover-title" id="linkPopoverTitle">链接内容</div>
    <button class="link-popover-close" id="linkPopoverClose" aria-label="关闭" data-i18n-aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div class="link-popover-body" id="linkPopoverBody"></div>
  <div class="link-popover-hint" data-i18n="轻触框外区域或点关闭按钮">轻触框外区域或点关闭按钮</div>
</section>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="目录" data-i18n-aria-label="目录"><div class="drawer-panel"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0" data-i18n="目录">目录</h2><button class="iconbtn" id="closeDrawer" aria-label="关闭" data-i18n-aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><div id="tocList"></div></div></div>

<section class="import-dialog" id="importDialog" role="dialog" aria-modal="true" aria-labelledby="importDialogTitle">
  <div class="import-dialog-box">
    <div class="import-dialog-head"><h2 id="importDialogTitle" data-i18n="导入 PUB">导入 PUB</h2><button class="iconbtn" id="importDialogClose" aria-label="关闭" data-i18n-aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <p class="sub" id="importDialogHint" data-i18n="未导入的文件默认勾选；已导入的文件默认不勾选；如需覆盖重新解析，请勾选对应文件。">未导入的文件默认勾选；已导入的文件默认不勾选；如需覆盖重新解析，请勾选对应文件。</p>
    <div class="import-file-list" id="importFileList"></div>
    <div class="import-dialog-actions">
      <button class="btn secondary" id="importSelectNew" data-i18n="全选未导入">全选未导入</button>
      <button class="btn" id="importConfirm" data-i18n="导入选中">导入选中</button>
      <button class="btn ghost" id="importCancel" data-i18n="取消">取消</button>
    </div>
  </div>
</section>


<div id="contextActions" class="context-actions" role="toolbar" aria-label="内容操作" data-i18n-aria-label="内容操作">
  <button type="button" class="ctx-action ctx-color-toggle" data-context-act="color" aria-expanded="false" data-i18n-title="高亮颜色" title="高亮颜色" aria-label="高亮颜色" data-i18n-aria-label="高亮颜色"><svg viewBox="0 0 49 22" width="49" height="22" aria-hidden="true"><circle cx="10" cy="11" r="10" fill="#f6c33c" fill-opacity=".85"/><circle cx="19.6" cy="11" r="10" fill="#86cf84" fill-opacity=".85"/><circle cx="29.2" cy="11" r="10" fill="#74b7e5" fill-opacity=".85"/><circle cx="38.8" cy="11" r="10" fill="#f195b1" fill-opacity=".85"/></svg></button>
  <span class="ctx-colors">
    <button type="button" class="ctx-color" data-context-color="#ffe58a" style="background:var(--hl-yellow)" aria-label="黄色高亮" data-i18n-aria-label="黄色高亮"></button>
    <button type="button" class="ctx-color" data-context-color="#b7e4c7" style="background:var(--hl-green)" aria-label="绿色高亮" data-i18n-aria-label="绿色高亮"></button>
    <button type="button" class="ctx-color" data-context-color="#bcd9f2" style="background:var(--hl-blue)" aria-label="蓝色高亮" data-i18n-aria-label="蓝色高亮"></button>
    <button type="button" class="ctx-color" data-context-color="#f4b6b6" style="background:#f4b6b6" aria-label="红色高亮" data-i18n-aria-label="红色高亮"></button>
  </span>
  <button type="button" class="ctx-action" data-context-act="info" data-i18n-title="经文信息" title="经文信息" aria-label="经文信息" data-i18n-aria-label="经文信息"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.4 5c3.1-1 5.9-.1 8.6 1.7v13.4c-2.7-1.8-5.5-2.7-8.6-1.7Z"/><path d="M20.6 5c-3.1-1-5.9-.1-8.6 1.7v13.4c2.7-1.8 5.5-2.7 8.6-1.7Z"/></svg></button>
  <button type="button" class="ctx-action" data-context-act="note" data-i18n-title="笔记" title="笔记" aria-label="笔记" data-i18n-aria-label="笔记"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4.5h14v10.6l-4.9 4.9H5Z"/><path d="M14.1 20v-4.9H19"/><path d="M12 7.6v5M9.5 10.1h5"/></svg></button>
  <button type="button" class="ctx-action" data-context-act="copy" data-i18n-title="复制" title="复制" aria-label="复制" data-i18n-aria-label="复制"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8.6" y="3.5" width="11.4" height="13.4" rx="2"/><rect x="4" y="7.1" width="11.4" height="13.4" rx="2" fill="#fff"/></svg></button>
  <button type="button" class="ctx-action" data-context-act="erase" data-i18n-title="清除颜色" title="清除颜色" aria-label="清除颜色" data-i18n-aria-label="清除颜色"><svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 7h15"/><path d="M9.5 7V4.5h5V7"/><path d="M6.5 7l.8 11.8a1.7 1.7 0 0 0 1.7 1.6h6a1.7 1.7 0 0 0 1.7-1.6L17.5 7"/><path d="M10 11v5.5M14 11v5.5"/></svg></button>
</div>
<section class="annotation-editor" id="annotationEditor" role="dialog" aria-modal="true" aria-labelledby="annotationHeading">
  <div class="annotation-box">
    <div class="annotation-head"><h2 id="annotationHeading" data-i18n="笔记">笔记</h2><button class="iconbtn" id="annotationClose" aria-label="关闭" data-i18n-aria-label="关闭"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="annotation-quote" id="annotationQuote"></div>
    <input class="note-input" id="annotationTitle" data-i18n-placeholder="标题" placeholder="标题">
    <textarea class="note-textarea" id="annotationText" data-i18n-placeholder="写批注…" placeholder="写批注…"></textarea>
    <div class="sub" data-i18n="标签">标签</div>
    <div class="study-tagbar editor-tags" id="annotationTags"></div>
    <div class="section-card-actions"><button class="btn" id="annotationSave" data-i18n="保存">保存</button><button class="btn ghost" id="annotationDelete" data-i18n="删除">删除</button></div>
  </div>
</section>
<section class="annotations-panel" id="annotationsPanel" role="dialog" aria-modal="true" aria-labelledby="annotationsTitle">
